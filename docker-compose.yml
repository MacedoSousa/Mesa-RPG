# PostgreSQL local para o Mesa RPG.
# Uso: docker compose up -d   (ou: npm run db:up)
services:
  postgres:
    image: postgres:16-alpine
    container_name: mesa-rpg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: mesa
      POSTGRES_DB: mesa_rpg
    ports:
      - "5432:5432"
    volumes:
      - mesa_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesa -d mesa_rpg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mesa_pgdata:
